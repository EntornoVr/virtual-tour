<!DOCTYPE html>
<html lang="es">
<head>
    <title>PRIME PADEL - Tour Virtual 360</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Librerías de Pannellum -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
    
    <!-- Iconos FontAwesome para los Hotspots -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: Arial, sans-serif;
        }
        
        #panorama { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
        }

        .overlay-title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            z-index: 10;
            pointer-events: none;
        }

        .overlay-title h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.4);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ESTILOS PERSONALIZADOS DE HOTSPOTS NEÓN */
        .custom-hotspot {
            height: 38px;
            width: 38px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: #07090e;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
            transition: transform 0.3s ease, background 0.3s ease;
            animation: pulse-radar 2s infinite;
        }

        @keyframes pulse-radar {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.8); }
            70% { box-shadow: 0 0 0 16px rgba(0, 242, 254, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }

        .custom-hotspot:hover {
            transform: scale(1.2);
            background: linear-gradient(135deg, #25d366 0%, #00f2fe 100%);
        }

        .custom-hotspot i {
            font-size: 16px;
            color: #07090e;
        }

        .pnm-tooltip {
            position: relative;
        }

        .pnm-tooltip span {
            visibility: hidden;
            background-color: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            text-align: center;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(0, 242, 254, 0.5);
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            pointer-events: none;
        }

        .custom-hotspot:hover .pnm-tooltip span {
            visibility: visible;
            opacity: 1;
        }

        /* -------------------------------------------------------------
           1. PUNTO CENTRAL FIJO (SOL / REFLECTOR)
        ------------------------------------------------------------- */
        .lens-flare-anchor {
            position: absolute;
            width: 1px;
            height: 1px;
            pointer-events: none;
            z-index: 5;
        }

        .flare-halo-white {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 260px;
            height: 260px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 1) 0%,
                rgba(255, 255, 255, 0.8) 15%,
                rgba(255, 255, 255, 0.2) 45%,
                rgba(255, 255, 255, 0) 70%
            );
            filter: blur(4px);
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* -------------------------------------------------------------
           2. DESTELLOS DE LENTE DINÁMICOS (OCTÁGONOS + CÍRCULOS)
        ------------------------------------------------------------- */
        #flare-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 6;
            overflow: hidden;
        }

        /* Clases Base */
        .flare-element {
            position: absolute;
            pointer-events: none;
            mix-blend-mode: screen;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.1s linear;
        }

        /* Forma Octagonal de 8 vértices */
        .shape-octagon {
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        }

        /* Forma Circular */
        .shape-circle {
            border-radius: 50%;
        }

        /* --- ESTILOS DE LOS ARTEFACTOS INTERCALADOS --- */

        /* 1. Octágono 1: Cian / Azul estilizado y compacto (140px) */
        .style-1 {
            background: radial-gradient(circle, rgba(0, 242, 254, 0.4) 0%, rgba(0, 180, 255, 0.2) 60%, rgba(0, 242, 254, 0.05) 100%);
            filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.5));
        }

        /* 2. Círculo 1: Anillo Violeta / Magenta suave y difuminado */
        .style-2 {
            background: radial-gradient(circle, rgba(138, 43, 226, 0.35) 0%, rgba(255, 0, 128, 0.15) 55%, rgba(138, 43, 226, 0.05) 80%, rgba(255, 255, 255, 0) 100%);
            box-shadow: 0 0 12px rgba(138, 43, 226, 0.3);
            filter: blur(1px);
        }

        /* 3. Octágono 2: Blanco / Azul brillante de diafragma central */
        .style-3 {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.7) 0%, rgba(0, 150, 255, 0.35) 70%, rgba(0, 242, 254, 0.1) 100%);
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.6));
        }

        /* 4. Círculo 2: Anillo Cilíndrico Verde / Dorado de óptica cine */
        .style-4 {
            background: radial-gradient(circle, rgba(0,0,0,0) 45%, rgba(50, 205, 50, 0.35) 75%, rgba(255, 215, 0, 0.2) 100%);
            border: 1px solid rgba(50, 205, 50, 0.4);
        }

        /* 5. Octágono 3: Micro-destello violeta nítido secundario */
        .style-5 {
            background: rgba(186, 85, 211, 0.65);
            filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.8));
        }
    </style>
</head>
<body>

    <div class="overlay-title">
        <h1>PRIME PADEL</h1>
    </div>

    <div id="panorama"></div>
    <div id="flare-overlay"></div>

    <script>
        let activeLightHotspots = [];

        function createFlareElement(hotSpotDiv, args) {
            hotSpotDiv.classList.add('lens-flare-anchor');
            
            // Valor de atenuación por defecto (si no se define en la escena, toma 1.0 = 100%)
            const attenuation = (args.attenuation !== undefined) ? args.attenuation : 1.0;

            const halo = document.createElement('div');
            halo.className = 'flare-halo-white';
            // Aplicamos la atenuación al halo central
            halo.style.opacity = attenuation;
            hotSpotDiv.appendChild(halo);

            activeLightHotspots.push({
                element: hotSpotDiv,
                pitch: args.pitch,
                yaw: args.yaw,
                attenuation: attenuation
            });
        }

        function customHotspot(hotspotDiv, args) {
            hotspotDiv.classList.add('custom-hotspot');
            
            var icon = document.createElement('i');
            icon.classList.add('fas', args.icon || 'fa-street-view');
            hotspotDiv.appendChild(icon);

            var tooltip = document.createElement('div');
            tooltip.classList.add('pnm-tooltip');
            tooltip.innerHTML = '<span>' + args.text + '</span>';
            hotspotDiv.appendChild(tooltip);
        }

        var viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "escena1",
                "author": "Entorno VR",
                "sceneFadeDuration": 1000,
                "autoLoad": true,
                "motionControls": true,
                "orientationOnByDefault": true
            },

            "scenes": {
                "escena1": {
                    "title": "Pista Central - Inicio",
                    "type": "equirectangular",
                    "panorama": "P01.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena2",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Entrada", "icon": "fa-arrow-up" }
                        },
                        {
                            "pitch": 25.0, "yaw": -40.0,
                            "createTooltipFunc": createFlareElement,
                            "createTooltipArgs": { "pitch": 25.0, "yaw": -40.0, "attenuation": 0.4 } // <--- Luz suave (40%)
                        },
                        {
                            "pitch": 15.0, "yaw": 60.0,
                            "createTooltipFunc": createFlareElement,
                            "createTooltipArgs": { "pitch": 15.0, "yaw": 60.0, "attenuation": 1.0 } // <--- Luz potente (100%)
                        }
                    ]
                },
                "escena2": {
                    "title": "Entrada",
                    "type": "equirectangular",
                    "panorama": "02.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena1",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Inicio", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena3",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Cancha abierta", "icon": "fa-arrow-up" }
                        },
                        {
                            "pitch": 30.0, "yaw": 15.0,
                            "createTooltipFunc": createFlareElement,
                            "createTooltipArgs": { "pitch": 30.0, "yaw": 15.0, "attenuation": 0.6 } // <--- Luz media (60%)
                        }
                    ]
                },
                "escena3": {
                    "title": "Cancha abierta",
                    "type": "equirectangular",
                    "panorama": "03.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena2",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Entrada", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena4",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Snack", "icon": "fa-arrow-up" }
                        },
                        {
                            "pitch": 20.0, "yaw": -60.0,
                            "createTooltipFunc": createFlareElement,
                            "createTooltipArgs": { "pitch": 20.0, "yaw": -60.0, "attenuation": 0.5 }
                        }
                    ]
                },
                "escena4": {
                    "title": "Snack",
                    "type": "equirectangular",
                    "panorama": "04.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena3",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Cancha abierta", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena5",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Canchas cerradas", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena5": {
                    "title": "Canchas cerradas",
                    "type": "equirectangular",
                    "panorama": "05.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena4",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Snack", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena6",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Cancha cerrada 1", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena6": {
                    "title": "Cancha cerrada 1",
                    "type": "equirectangular",
                    "panorama": "06.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena5",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Canchas cerradas", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena7",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Entrada al privado", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena7": {
                    "title": "Entrada al privado",
                    "type": "equirectangular",
                    "panorama": "07.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena6",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Cancha cerrada 1", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena8",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Zona Privada Climatizada", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena8": {
                    "title": "Zona Privada Climatizada",
                    "type": "equirectangular",
                    "panorama": "08.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena7",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Entrada al privado", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena9",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Baños y Regaderas", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena9": {
                    "title": "Baños y Regaderas",
                    "type": "equirectangular",
                    "panorama": "09.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena8",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Zona Privada", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena10",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Sport Bar", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena10": {
                    "title": "Sport Bar",
                    "type": "equirectangular",
                    "panorama": "10.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena9",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Baños y Regaderas", "icon": "fa-arrow-down" }
                        }
                    ]
                }
            }
        });

        viewer.on('scenechange', function() {
            activeLightHotspots = [];
            document.getElementById('flare-overlay').innerHTML = '';
        });

        // SECUENCIA INTERCALADA: OCTÁGONO -> CÍRCULO -> OCTÁGONO -> CÍRCULO...
        const flareOverlay = document.getElementById('flare-overlay');
        const flareDefs = [
            { size: 140, shapeClass: 'shape-octagon', styleClass: 'style-1', offsetFactor: 0.35 },
            { size: 180, shapeClass: 'shape-circle',  styleClass: 'style-2', offsetFactor: 0.70 },
            { size: 85,  shapeClass: 'shape-octagon', styleClass: 'style-3', offsetFactor: 1.05 },
            { size: 130, shapeClass: 'shape-circle',  styleClass: 'style-4', offsetFactor: 1.35 },
            { size: 40,  shapeClass: 'shape-octagon', styleClass: 'style-5', offsetFactor: 1.65 }
        ];

        const dynamicFlares = [];
        flareDefs.forEach(def => {
            const el = document.createElement('div');
            el.className = `flare-element ${def.shapeClass} ${def.styleClass}`;
            el.style.width = `${def.size}px`;
            el.style.height = `${def.size}px`;
            flareOverlay.appendChild(el);
            dynamicFlares.push({ el, factor: def.offsetFactor });
        });

        function updateFlares() {
            if (activeLightHotspots.length > 0) {
                const screenCenterX = window.innerWidth / 2;
                const screenCenterY = window.innerHeight / 2;
                
                let primaryLight = null;

                for (let light of activeLightHotspots) {
                    if (light.element && light.element.getBoundingClientRect) {
                        const rect = light.element.getBoundingClientRect();
                        
                        if (rect.width > 0 && rect.top >= -150 && rect.left >= -150 && 
                            rect.bottom <= window.innerHeight + 150 && 
                            rect.right <= window.innerWidth + 150) {
                            
                            primaryLight = {
                                x: rect.left + rect.width / 2,
                                y: rect.top + rect.height / 2,
                                attenuation: light.attenuation
                            };
                            break;
                        }
                    }
                }

                if (primaryLight) {
                    const dx = primaryLight.x - screenCenterX;
                    const dy = primaryLight.y - screenCenterY;
                    const distFromCenter = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = Math.sqrt(screenCenterX * screenCenterX + screenCenterY * screenCenterY);

                    // Calculamos la opacidad base por distancia y la multiplicamos por el factor "attenuation" de ese punto
                    let opacity = 1 - (distFromCenter / (maxDist * 0.95));
                    opacity = Math.max(0, Math.min(1, opacity)) * primaryLight.attenuation;

                    dynamicFlares.forEach(item => {
                        const rx = screenCenterX - dx * item.factor;
                        const ry = screenCenterY - dy * item.factor;

                        item.el.style.left = `${rx}px`;
                        item.el.style.top = `${ry}px`;
                        item.el.style.opacity = opacity;
                    });
                } else {
                    dynamicFlares.forEach(item => item.el.style.opacity = 0);
                }
            } else {
                dynamicFlares.forEach(item => item.el.style.opacity = 0);
            }

            requestAnimationFrame(updateFlares);
        }

        requestAnimationFrame(updateFlares);

        document.body.addEventListener('click', function() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(function(response) {
                        if (response === 'granted') {
                            viewer.startOrientation();
                        }
                    })
                    .catch(console.error);
            } else {
                viewer.startOrientation();
            }
        }, { once: true });
    </script>
</body>
</html>
