<!DOCTYPE html>
<html lang="es">
<head>
    <title>PRIME PADEL - Tour Virtual 360</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Librerías de Pannellum -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
    
    <!-- Iconos FontAwesome para los Hotspots -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: Arial, sans-serif;
        }
        
        #panorama { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
        }

        /* Estilo para que el título flote sobre el panorama */
        .overlay-title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            z-index: 10;
            pointer-events: none;
        }

        .overlay-title h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.4);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ESTILOS PERSONALIZADOS DE HOTSPOTS NEÓN */
        .custom-hotspot {
            height: 38px;
            width: 38px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            color: #07090e;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
            transition: transform 0.3s ease, background 0.3s ease;
            animation: pulse-radar 2s infinite;
        }

        @keyframes pulse-radar {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.8); }
            70% { box-shadow: 0 0 0 16px rgba(0, 242, 254, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }

        .custom-hotspot:hover {
            transform: scale(1.2);
            background: linear-gradient(135deg, #25d366 0%, #00f2fe 100%);
        }

        .custom-hotspot i {
            font-size: 16px;
            color: #07090e;
        }

        .pnm-tooltip {
            position: relative;
        }

        .pnm-tooltip span {
            visibility: hidden;
            background-color: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            text-align: center;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(0, 242, 254, 0.5);
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            pointer-events: none;
        }

        .custom-hotspot:hover .pnm-tooltip span {
            visibility: visible;
            opacity: 1;
        }

        /* -------------------------------------------------------------
           1. PUNTO CENTRAL FIJO (SOL / REFLECTOR BLANCO)
        ------------------------------------------------------------- */
        .lens-flare-anchor {
            position: absolute;
            width: 1px;
            height: 1px;
            pointer-events: none;
            z-index: 5;
        }

        .flare-halo-white {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 260px;
            height: 260px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(255, 255, 255, 1) 0%,
                rgba(255, 255, 255, 0.7) 20%,
                rgba(255, 255, 255, 0.25) 50%,
                rgba(255, 255, 255, 0) 75%
            );
            filter: blur(6px);
            pointer-events: none;
            mix-blend-mode: screen;
        }

        /* -------------------------------------------------------------
           2. DESTELLOS DE LENTE DINÁMICOS (ESTILO ORIGINAL RESTAURADO)
        ------------------------------------------------------------- */
        #flare-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 6;
            overflow: hidden;
        }

        .dynamic-flare-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            mix-blend-mode: screen;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.1s linear;
        }

        /* Anillo 1: Halo grande difuminado exterior */
        .ring-style-1 {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(180, 220, 255, 0.15) 40%, rgba(255, 255, 255, 0) 70%);
            filter: blur(10px);
        }

        /* Anillo 2: Anillo de lente definido cian/violeta */
        .ring-style-2 {
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, rgba(138, 43, 226, 0.15) 60%, rgba(255, 255, 255, 0) 75%);
            border: 2px solid rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
        }

        /* Anillo 3: Círculo pequeño azul nítido */
        .ring-style-3 {
            background: radial-gradient(circle, rgba(0, 180, 255, 0.6) 0%, rgba(0, 242, 254, 0.2) 70%, rgba(255, 255, 255, 0) 100%);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Anillo 4: Pequeño destello secundario violeta */
        .ring-style-4 {
            background: radial-gradient(circle, rgba(186, 85, 211, 0.5) 0%, rgba(138, 43, 226, 0.1) 80%);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="overlay-title">
        <h1>PRIME PADEL</h1>
    </div>

    <div id="panorama"></div>
    <div id="flare-overlay"></div>

    <script>
        // Registro de puntos de luz de la escena activa
        let activeLightHotspots = [];

        // Renderiza el punto fijo del sol/luz
        function createFlareElement(hotSpotDiv, args) {
            hotSpotDiv.classList.add('lens-flare-anchor');
            
            const halo = document.createElement('div');
            halo.className = 'flare-halo-white';
            hotSpotDiv.appendChild(halo);

            activeLightHotspots.push({
                element: hotSpotDiv,
                pitch: args.pitch,
                yaw: args.yaw
            });
        }

        // Renderiza los hotspots de navegación
        function customHotspot(hotspotDiv, args) {
            hotspotDiv.classList.add('custom-hotspot');
            
            var icon = document.createElement('i');
            icon.classList.add('fas', args.icon || 'fa-street-view');
            hotspotDiv.appendChild(icon);

            var tooltip = document.createElement('div');
            tooltip.classList.add('pnm-tooltip');
            tooltip.innerHTML = '<span>' + args.text + '</span>';
            hotspotDiv.appendChild(tooltip);
        }

        // CONFIGURACIÓN DE PANNELLUM
        var viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "escena1",
                "author": "Entorno VR",
                "sceneFadeDuration": 1000,
                "autoLoad": true,
                "motionControls": true,
                "orientationOnByDefault": true
            },

            "scenes": {
                "escena1": {
                    "title": "Pista Central - Inicio",
                    "type": "equirectangular",
                    "panorama": "P01.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena2",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Entrada", "icon": "fa-arrow-up" }
                        },
                        {
                            "pitch": 25.0, "yaw": -40.0,
                            "createTooltipFunc": createFlareElement,
                            "createTooltipArgs": { "pitch": 25.0, "yaw": -40.0 }
                        },
                        {
                            "pitch": 15.0, "yaw": 60.0,
                            "createTooltipFunc": createFlareElement,
                            "createTooltipArgs": { "pitch": 15.0, "yaw": 60.0 }
                        }
                    ]
                },
                "escena2": {
                    "title": "Entrada",
                    "type": "equirectangular",
                    "panorama": "02.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena1",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Inicio", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena3",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Cancha abierta", "icon": "fa-arrow-up" }
                        },
                        {
                            "pitch": 30.0, "yaw": 15.0,
                            "createTooltipFunc": createFlareElement,
                            "createTooltipArgs": { "pitch": 30.0, "yaw": 15.0 }
                        }
                    ]
                },
                "escena3": {
                    "title": "Cancha abierta",
                    "type": "equirectangular",
                    "panorama": "03.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena2",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Entrada", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena4",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Snack", "icon": "fa-arrow-up" }
                        },
                        {
                            "pitch": 20.0, "yaw": -60.0,
                            "createTooltipFunc": createFlareElement,
                            "createTooltipArgs": { "pitch": 20.0, "yaw": -60.0 }
                        }
                    ]
                },
                "escena4": {
                    "title": "Snack",
                    "type": "equirectangular",
                    "panorama": "04.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena3",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Cancha abierta", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena5",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Canchas cerradas", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena5": {
                    "title": "Canchas cerradas",
                    "type": "equirectangular",
                    "panorama": "05.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena4",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Snack", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena6",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Cancha cerrada 1", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena6": {
                    "title": "Cancha cerrada 1",
                    "type": "equirectangular",
                    "panorama": "06.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena5",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Canchas cerradas", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena7",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Entrada al privado", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena7": {
                    "title": "Entrada al privado",
                    "type": "equirectangular",
                    "panorama": "07.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena6",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Cancha cerrada 1", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena8",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Zona Privada Climatizada", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena8": {
                    "title": "Zona Privada Climatizada",
                    "type": "equirectangular",
                    "panorama": "08.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena7",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Entrada al privado", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena9",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Baños y Regaderas", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena9": {
                    "title": "Baños y Regaderas",
                    "type": "equirectangular",
                    "panorama": "09.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena8",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Zona Privada", "icon": "fa-arrow-down" }
                        },
                        { 
                            "pitch": -5, "yaw": 0, "type": "scene", "sceneId": "escena10",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Ir a Sport Bar", "icon": "fa-arrow-up" }
                        }
                    ]
                },
                "escena10": {
                    "title": "Sport Bar",
                    "type": "equirectangular",
                    "panorama": "10.jpg",
                    "hotSpots": [
                        { 
                            "pitch": -5, "yaw": 180, "type": "scene", "sceneId": "escena9",
                            "createTooltipFunc": customHotspot,
                            "createTooltipArgs": { "text": "Volver a Baños y Regaderas", "icon": "fa-arrow-down" }
                        }
                    ]
                }
            }
        });

        // Limpiar registro al cambiar de escena
        viewer.on('scenechange', function() {
            activeLightHotspots = [];
            document.getElementById('flare-overlay').innerHTML = '';
        });

        // DEFINICIÓN Y GENERACIÓN DE ANILLOS DE LENTE ESTILO FOTOGRÁFICO
        const flareOverlay = document.getElementById('flare-overlay');
        const ringDefs = [
            { size: 450, styleClass: 'ring-style-1', offsetFactor: 0.3 },
            { size: 220, styleClass: 'ring-style-2', offsetFactor: 0.7 },
            { size: 110, styleClass: 'ring-style-3', offsetFactor: 1.15 },
            { size: 65,  styleClass: 'ring-style-4', offsetFactor: 1.45 }
        ];

        const dynamicRings = [];
        ringDefs.forEach(def => {
            const el = document.createElement('div');
            el.className = `dynamic-flare-ring ${def.styleClass}`;
            el.style.width = `${def.size}px`;
            el.style.height = `${def.size}px`;
            flareOverlay.appendChild(el);
            dynamicRings.push({ el, factor: def.offsetFactor });
        });

        // CÁLCULO DE POSICIÓN Y VISIBILIDAD EN TIEMPO REAL
        function updateFlares() {
            if (activeLightHotspots.length > 0) {
                const screenCenterX = window.innerWidth / 2;
                const screenCenterY = window.innerHeight / 2;
                
                let primaryLightScreenPos = null;

                for (let light of activeLightHotspots) {
                    if (light.element && light.element.getBoundingClientRect) {
                        const rect = light.element.getBoundingClientRect();
                        
                        // Validar visibilidad en viewport
                        if (rect.width > 0 && rect.top >= -150 && rect.left >= -150 && 
                            rect.bottom <= window.innerHeight + 150 && 
                            rect.right <= window.innerWidth + 150) {
                            
                            primaryLightScreenPos = {
                                x: rect.left + rect.width / 2,
                                y: rect.top + rect.height / 2
                            };
                            break;
                        }
                    }
                }

                if (primaryLightScreenPos) {
                    const dx = primaryLightScreenPos.x - screenCenterX;
                    const dy = primaryLightScreenPos.y - screenCenterY;
                    const distFromCenter = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = Math.sqrt(screenCenterX * screenCenterX + screenCenterY * screenCenterY);

                    // La intensidad aumenta cuando la luz se acerca al centro o bordes visibles
                    let opacity = 1 - (distFromCenter / (maxDist * 0.95));
                    opacity = Math.max(0, Math.min(1, opacity));

                    dynamicRings.forEach(ring => {
                        const rx = screenCenterX - dx * ring.factor;
                        const ry = screenCenterY - dy * ring.factor;

                        ring.el.style.left = `${rx}px`;
                        ring.el.style.top = `${ry}px`;
                        ring.el.style.opacity = opacity;
                    });
                } else {
                    dynamicRings.forEach(ring => ring.el.style.opacity = 0);
                }
            } else {
                dynamicRings.forEach(ring => ring.el.style.opacity = 0);
            }

            requestAnimationFrame(updateFlares);
        }

        requestAnimationFrame(updateFlares);

        // DESBLOQUEO DE PERMISOS DE MOVIMIENTO (Móviles)
        document.body.addEventListener('click', function() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(function(response) {
                        if (response === 'granted') {
                            viewer.startOrientation();
                        }
                    })
                    .catch(console.error);
            } else {
                viewer.startOrientation();
            }
        }, { once: true });
    </script>
</body>
</html>
